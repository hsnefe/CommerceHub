spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/order_db
    username: order_user
    password: order_pass
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - com.commercehub.messaging.CommonMessagingAutoConfiguration

auth:
  jwt:
    secret: test-secret-key-for-integration-tests-min-32-chars

commercehub:
  product-service:
    base-url: http://localhost:8082
  auth-service:
    base-url: http://localhost:8081
