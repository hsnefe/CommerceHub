server:
  port: 8087

spring:
  application:
    name: payment-service
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:commercehub}
    password: ${SPRING_RABBITMQ_PASSWORD:commercehub}

payment:
  simulate-failure: ${PAYMENT_SIMULATE_FAILURE:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
