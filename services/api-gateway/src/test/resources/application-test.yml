gateway:
  rate-limit:
    enabled: true
    replenish-rate: 1
    burst-capacity: 2
    requested-tokens: 1

auth:
  jwt:
    secret: test-secret-key-for-integration-tests-min-32-chars
    access-token-expiration-seconds: 3600

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
