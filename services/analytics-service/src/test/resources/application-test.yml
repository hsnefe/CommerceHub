spring:
  datasource:
    url: jdbc:h2:mem:analytics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - com.commercehub.messaging.CommonMessagingAutoConfiguration

auth:
  jwt:
    secret: test-secret-key-for-integration-tests-min-32-chars
