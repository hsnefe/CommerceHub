services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: commercehub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: commercehub
      RABBITMQ_DEFAULT_PASS: commercehub
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16
    container_name: commercehub-auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5433:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services
      dockerfile: auth-service/Dockerfile
    container_name: commercehub-auth-service
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_pass
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      AUTH_EMAIL_VERIFICATION_REQUIRED: "false"

  product-db:
    image: postgres:16
    container_name: commercehub-product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    ports:
      - "5434:5432"
    volumes:
      - product_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-service:
    build:
      context: ./services
      dockerfile: product-service/Dockerfile
    container_name: commercehub-product-service
    ports:
      - "8082:8082"
    depends_on:
      product-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_user
      SPRING_DATASOURCE_PASSWORD: product_pass
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars

  inventory-db:
    image: postgres:16
    container_name: commercehub-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5435:5432"
    volumes:
      - inventory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build:
      context: ./services
      dockerfile: inventory-service/Dockerfile
    container_name: commercehub-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      inventory-db:
        condition: service_healthy
      product-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      PRODUCT_SERVICE_BASE_URL: http://product-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: commercehub
      SPRING_RABBITMQ_PASSWORD: commercehub

  order-db:
    image: postgres:16
    container_name: commercehub-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5436:5432"
    volumes:
      - order_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    container_name: commercehub-order-service
    ports:
      - "8084:8084"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order_pass
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      PRODUCT_SERVICE_BASE_URL: http://product-service:8082
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: commercehub
      SPRING_RABBITMQ_PASSWORD: commercehub

  notification-service:
    build:
      context: ./services
      dockerfile: notification-service/Dockerfile
    container_name: commercehub-notification-service
    ports:
      - "8085:8085"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: commercehub
      SPRING_RABBITMQ_PASSWORD: commercehub

volumes:
  auth_pg_data:
  product_pg_data:
  inventory_pg_data:
  order_pg_data:
